<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Russia Globe Widget — Demo</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      background: #0a0a0a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    #globe-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    .overlay {
      position: absolute;
      top: 16px; left: 16px;
      background: rgba(0,0,0,0.6);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      pointer-events: none;
      z-index: 10;
    }
    .overlay h1 {
      margin: 0 0 4px 0;
      font-size: 18px;
      color: #ff4444;
    }
    .overlay p {
      margin: 0;
      color: #aaa;
      font-size: 12px;
    }
    .loading {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #888;
      font-size: 14px;
      z-index: 5;
    }
  </style>
</head>
<body>
  <div id="globe-container">
    <div class="overlay">
      <h1>🇷🇺 Россия</h1>
      <p>Крути пальцем / мышкой · Scroll — приближение</p>
    </div>
    <div class="loading" id="loading">Загрузка глобуса…</div>
  </div>

  <script src="/widget.js"></script>
  <script>
    RussiaGlobe.init({
      container: 'globe-container',
      apiUrl: window.location.origin + '/api',
      onReady: function () {
        var el = document.getElementById('loading');
        if (el) el.style.display = 'none';
      }
    });
  </script>
</body>
</html>
